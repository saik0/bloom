[package]
name = "bloom"
version = "0.1.0"
edition = "2021"

[dependencies]
# UI
iced = { version = "0.14.0", features = ["tokio", "wgpu"] }

# Database (side-channel for analytics, not source of truth)
surrealdb = { version = "2.4", features = ["kv-mem"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1", features = ["full"] }

# Syntax tree (THE source of truth)
ra_ap_syntax = "=0.0.230"

# Core
blake3 = "1.8"
hex = "0.4"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
