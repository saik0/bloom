[package]
name = "bloom"
version = "0.1.0"
edition = "2021"

[dependencies]
# UI
iced = { version = "0.14.0", features = ["tokio", "wgpu"] }
iced_wgpu = "0.14.0"
# If direct HAL access is needed:
wgpu-hal = "28.0"

# Database
surrealdb = { version = "2.4", features = ["kv-mem"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1", features = ["full"] }

# Phase 1: CST
ra_ap_syntax = "=0.0.230"

# Core
uuid = { version = "1.19", features = ["v5", "v7", "serde"] }
blake3 = "1.8"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
